# --- CONNEXION AU SERVEUR DE CONFIGURATION ---
# Cette ligne est le lien avec ton "Cerveau Central". Elle ordonne au microservice
# d'appeler le Config Server (port 8071) pour r\u00E9cup\u00E9rer ses r\u00E9glages sur GitHub.
# "optional:" garantit que l'appli ne plante pas si le serveur met du temps \u00E0 r\u00E9pondre.
spring.config.import=optional:configserver:http://localhost:8071/

# --- R\u00C9GLAGES R\u00C9SEAU ET IDENTIT\u00C9 ---
# D\u00E9finit le port d'\u00E9coute unique pour ce service (8084).
server.port=8084
# Le nom "officiel" du microservice. C'est ce nom que la Gateway et Consul utilisent.
spring.application.name=rulename

# --- CONFIGURATION DE LA BASE DE DONN\u00C9ES H2 ---
# Adresse de la base de donn\u00E9es en m\u00E9moire vive (RAM). Elle s'appelle "rulenamedb".
spring.datasource.url=jdbc:h2:mem:rulenamedb
# Le "traducteur" Java n\u00E9cessaire pour communiquer avec le moteur H2.
spring.datasource.driverClassName=org.h2.Driver
# Identifiant par d\u00E9faut de l'administrateur de la base.
spring.datasource.username=sa
# Pas de mot de passe par d\u00E9faut pour H2 en mode d\u00E9veloppement.
spring.datasource.password=
# Active l'interface visuelle pour voir les tables (http://localhost:8084/h2-console).
spring.h2.console.enabled=true

# --- INITIALISATION DES DONN\u00C9ES (JPA/SQL) ---
# TR\u00C8S IMPORTANT : Force Spring \u00E0 attendre que Hibernate ait cr\u00E9\u00E9 la table SQL
# avant de lire ton fichier data.sql. Sans \u00E7a, l'insertion des donn\u00E9es \u00E9choue.
spring.jpa.defer-datasource-initialization=true
# Dit au microservice de toujours charger le fichier data.sql au d\u00E9marrage.
spring.sql.init.mode=always

# --- ENREGISTREMENT DANS L'ANNUAIRE (CONSUL) ---
# Adresse du conteneur Consul dans ton r\u00E9seau Docker.
spring.cloud.consul.host=consul
# Port de communication avec Consul (8500).
spring.cloud.consul.port=8500
# Cr\u00E9e une immatriculation unique dans l'annuaire (nom du service + un chiffre au hasard).
# Cela permet d'avoir plusieurs copies du m\u00EAme service sans conflit.
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
# Le nom sous lequel le service sera list\u00E9 dans le r\u00E9pertoire (http://localhost:8500).
spring.cloud.consul.discovery.service-name=${spring.application.name}
# Utilise l'adresse IP interne de Docker pour que la Gateway trouve ce service facilement.
spring.cloud.consul.discovery.prefer-ip-address=true

# --- SURVEILLANCE DE SANT\u00C9 (ACTUATOR) ---
# Ouvre l'adresse "/actuator/health" pour que Consul puisse v\u00E9rifier que le service est vivant.
# C'est ce qui fait passer le voyant au VERT dans l'interface de Consul.
management.endpoints.web.exposure.include=health
# Affiche le d\u00E9tail complet (disque, base, etc.) dans le message de sant\u00E9.
management.endpoint.health.show-details=always

#\u00C0 quoi sert-il ?
#C'est le Cerveau de Configuration. Ce fichier ne contient pas de code Java, mais il contient toute la "strat\u00E9gie" du microservice. Il d\u00E9finit son identit\u00E9, sa base de donn\u00E9es, et comment il doit s'int\u00E9grer dans ton usine Docker.
#
#Ce qu'il faut retenir :
#
#    Architecture Distribu\u00E9e : Les lignes spring.cloud.consul prouvent que ton service n'est pas isol\u00E9. Il fait partie d'un r\u00E9seau o\u00F9 il se d\u00E9clare automatiquement.
#
#    Externalisation : La premi\u00E8re ligne (configserver) montre que tu as compris l'importance de centraliser les r\u00E9glages sur GitHub pour \u00EAtre plus agile.
#
#    Survie et Diagnostic : Les lignes management (Actuator) sont tes yeux. Elles permettent \u00E0 Consul (et \u00E0 toi) de savoir instantan\u00E9ment si le service est "en bonne sant\u00E9" ou s'il a besoin d'une r\u00E9paration.