# --- R\u00C9GLAGES DU PORTIER ---
# Le port d'entr\u00E9e unique pour tout ton projet. L'utilisateur ne tape que cette adresse.
server.port=9090
# Le nom logique de ce service. Utilis\u00E9 pour son identification dans Consul.
spring.application.name=gateway

# --- CONNEXION AU CERVEAU (CONFIG SERVER) ---
# Dit \u00E0 la Gateway d'aller chercher sa configuration sur le serveur d\u00E9di\u00E9 (port 8071).
# On utilise le nom "configserver" car c'est son nom dans le r\u00E9seau Docker.
spring.config.import=optional:configserver:http://configserver:8071/

# --- CONNEXION \u00C0 L'ANNUAIRE (CONSUL) ---
# Adresse du conteneur Consul pour que la Gateway sache o\u00F9 trouver les autres services.
spring.cloud.consul.host=consul
spring.cloud.consul.port=8500

# --- D\u00C9COUVERTE AUTOMATIQUE ---
# Active la cr\u00E9ation automatique de routes.
# Si un service s'appelle "trade", la Gateway cr\u00E9era automatiquement la route /trade/**
spring.cloud.gateway.discovery.locator.enabled=true
# Force la Gateway \u00E0 chercher les noms en minuscules dans Consul pour \u00E9viter les erreurs.
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# --- CONFIGURATION DES ROUTES PRIORITAIRES ---
# On d\u00E9finit une route sp\u00E9cifique pour le portail UI pour g\u00E9rer le design et la navigation.
spring.cloud.gateway.routes[0].id=poseidon-ui-route
# "lb://" signifie Load Balancer : la Gateway demande \u00E0 Consul l'adresse du service "poseidon-ui".
spring.cloud.gateway.routes[0].uri=lb://poseidon-ui
# Liste de tous les chemins qui doivent \u00EAtre redirig\u00E9s vers l'interface utilisateur.
# On y met l'accueil, les pages de login/register, le CSS et tous les menus m\u00E9tier.
spring.cloud.gateway.routes[0].predicates[0]=Path=/, /login/**, /logout/**, /register/**, /css/**, /js/**, /bidList/**, /curvePoint/**, /rating/**, /trade/**, /ruleName/**, /users/**
# "order=-1" donne la priorit\u00E9 absolue \u00E0 cette r\u00E8gle sur les r\u00E8gles automatiques.
spring.cloud.gateway.routes[0].order=-1

# --- FILTRE DE S\u00C9CURIT\u00C9 ---
# TR\u00C8S IMPORTANT : Dit \u00E0 la Gateway de garder l'adresse "localhost:9090" dans les messages.
# Sans cela, Spring Security essaierait de te rediriger vers l'IP interne de Docker (172...), ce qui ferait une erreur.
spring.cloud.gateway.default-filters[0]=PreserveHostHeader

# --- SURVEILLANCE ET SANT\u00C9 (ACTUATOR) ---
# Ouvre la porte pour que Consul puisse v\u00E9rifier que la Gateway n'est pas plant\u00E9e.
management.endpoints.web.exposure.include=health
# Affiche les d\u00E9tails techniques de sant\u00E9 dans le JSON de r\u00E9ponse.
management.endpoint.health.show-details=always

#\u00C0 quoi sert-il ?
#C'est la Carte de Routage de ton application. La Gateway est le seul microservice qui "voit" \u00E0 la fois l'utilisateur final et tous les autres microservices cach\u00E9s. Ce fichier lui dit comment faire le lien entre les deux.
#
#Ce qu'il faut retenir :
#
#    Le Portier unique (9090) : C'est ici qu'on d\u00E9finit la seule porte ouverte de ton syst\u00E8me.
#
#    L'Aiguillage (Routes) : La section routes[0] est le morceau le plus important. C'est elle qui fait que ton site est "beau" et que les liens fonctionnent. Elle dit \u00E0 la Gateway : "Tout ce qui ressemble \u00E0 une page web ou \u00E0 du CSS, envoie-le au microservice UI".
#
#    La Coh\u00E9rence R\u00E9seau (PreserveHostHeader) : C'est le r\u00E9glage qui permet \u00E0 ton syst\u00E8me de s\u00E9curit\u00E9 de fonctionner. Il garantit que l'adresse dans ton navigateur reste toujours localhost:9090, m\u00EAme si en r\u00E9alit\u00E9 5 microservices se parlent derri\u00E8re.
#
#    L'Intelligence collective : Gr\u00E2ce \u00E0 la connexion Consul, la Gateway n'a pas besoin de conna\u00EEtre les adresses IP des services. Elle demande juste \u00E0 l'annuaire.