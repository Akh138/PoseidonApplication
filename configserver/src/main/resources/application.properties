# --- R\u00C9GLAGES DU SERVEUR ---
# Le port d'\u00E9coute du serveur de configuration. 8071 est le port standard pour ce service.
server.port=8071
# Le nom logique de cette application. Indispensable pour que le service soit identifiable.
spring.application.name=configserver

# --- SOURCE DES DONN\u00C9ES (GITHUB) ---
# D\u00E9finit le profil "git" comme actif. Cela dit \u00E0 Spring que les fichiers de config sont sur un d\u00E9p\u00F4t Git.
spring.profiles.active=git
# L'URL de ton d\u00E9p\u00F4t GitHub o\u00F9 tu as stock\u00E9 tes fichiers .properties (bidlist.properties, etc.)
spring.cloud.config.server.git.uri=https://github.com/Akh138/Poseidon-config
# Dit au serveur de t\u00E9l\u00E9charger (cloner) le d\u00E9p\u00F4t GitHub d\u00E8s qu'il d\u00E9marre, sans attendre de requ\u00EAte.
spring.cloud.config.server.git.clone-on-start=true
# Pr\u00E9cise la branche du d\u00E9p\u00F4t GitHub \u00E0 utiliser (ici la branche principale 'main').
spring.cloud.config.server.git.default-label=main

# --- ENREGISTREMENT DANS CONSUL (D\u00C9COUVERTE) ---
# Adresse r\u00E9seau du conteneur Consul (d\u00E9fini dans ton docker-compose).
spring.cloud.consul.host=consul
# Port de communication avec Consul.
spring.cloud.consul.port=8500
# Active l'auto-enregistrement : le Config Server va s'inscrire tout seul dans l'annuaire Consul.
spring.cloud.consul.discovery.enabled=true
# Cr\u00E9e un identifiant unique pour ce serveur dans Consul (nom + valeur al\u00E9atoire).
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
# Le nom sous lequel le serveur de config appara\u00EEtra dans la liste des services Consul.
spring.cloud.consul.discovery.service-name=${spring.application.name}
# Utilise l'adresse IP du conteneur au lieu de son nom d'h\u00F4te pour une meilleure stabilit\u00E9 Docker.
spring.cloud.consul.discovery.prefer-ip-address=true

# --- SURVEILLANCE ET SANT\u00C9 (ACTUATOR) ---
# Autorise l'acc\u00E8s \u00E0 l'URL /actuator/health pour que Consul v\u00E9rifie si le serveur fonctionne.
management.endpoints.web.exposure.include=health
# Affiche tous les d\u00E9tails de sant\u00E9 du serveur (utile pour savoir pourquoi le voyant serait rouge).
management.endpoint.health.show-details=always

#\u00C0 quoi sert-il ?
#Ce fichier est le Plan de Connexion du serveur de configuration. Il lui donne trois missions :
#
#    R\u00E9cup\u00E9rer : Se connecter \u00E0 GitHub pour r\u00E9cup\u00E9rer les r\u00E9glages.
#
#    S'afficher : S'inscrire dans Consul pour que la Gateway et les autres services sachent qu'il existe et o\u00F9 il se trouve.
#
#    Surveiller : Donner des informations sur sa propre sant\u00E9 (voyant vert dans Consul).
#
#Ce qu'il faut retenir :
#
#    Centralisation : Sans ce fichier et les r\u00E9glages Git, chaque microservice devrait avoir ses propres mots de passe en local, ce qui n'est pas s\u00E9curis\u00E9.
#
#    Visibilit\u00E9 : Les lignes Consul permettent au serveur de ne pas \u00EAtre "isol\u00E9". Il fait partie de l'\u00E9quipe des microservices et tout le monde peut le trouver.
#
#    Actuator : C'est le "garde du corps". Il r\u00E9pond aux tests de sant\u00E9 de Docker et de Consul.