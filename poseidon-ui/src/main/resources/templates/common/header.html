<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="menu">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">🔱 POSEIDON</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto ms-4">
                    <li class="nav-item"><a class="nav-link" th:href="@{/bidList/list}">Bids</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/curvePoint/list}">Curves</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/rating/list}">Ratings</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/trade/list}">Trade</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/ruleName/list}">Rules</a></li>

                    <!-- ICI LA SÉCURITÉ : Seul l'ADMIN voit ce lien -->
                    <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                        <a class="nav-link text-warning" th:href="@{/users/list}">ADMIN : Users</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center">
                        <span class="text-light me-3" sec:authorize="isAuthenticated()">
                            Bienvenue, <span class="text-info" sec:authentication="name">Nom</span>
                        </span>
                    <form th:action="@{/logout}" method="post">
                        <button class="btn btn-outline-danger btn-sm" type="submit">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
