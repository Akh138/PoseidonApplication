<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Poseidon - Modifier l'utilisateur</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row mt-5 justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-info">
                <div class="card-header bg-info text-white">
                    <h3 class="mb-0">Modifier l'utilisateur : <span th:text="${user.username}"></span></h3>
                </div>
                <div class="card-body p-4">
                    <!-- novalidate pour tester les messages d'erreur Java -->
                    <form th:action="@{/users/update/{id}(id=${user.id})}" th:object="${user}" method="post" novalidate>

                        <!-- CHAMP CACHÉ POUR L'ID -->
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="fullname" class="form-label font-weight-bold">Nom Complet</label>
                            <input type="text" th:field="*{fullname}" id="fullname" class="form-control" placeholder="Prénom Nom">
                            <p class="text-danger" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label font-weight-bold">Identifiant (Username)</label>
                            <input type="text" th:field="*{username}" id="username" class="form-control">
                            <p class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label font-weight-bold">Nouveau mot de passe</label>
                            <input type="password" th:field="*{password}" id="password" class="form-control" placeholder="Laissez vide pour ne pas changer">
                            <p class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                        </div>

                        <div class="mb-4 border-top pt-3">
                            <label class="form-label font-weight-bold">Rôle</label><br/>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{role}" th:value="ADMIN" id="roleAdminUpdate">
                                <label class="form-check-label" for="roleAdminUpdate">Admin</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{role}" th:value="USER" id="roleUserUpdate">
                                <label class="form-check-label" for="roleUserUpdate">User</label>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
                            <a th:href="@{/users/list}" class="btn btn-outline-danger">Annuler</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
