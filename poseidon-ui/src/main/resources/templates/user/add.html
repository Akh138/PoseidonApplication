<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Poseidon - Ajouter un utilisateur</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row mt-5 justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Créer un nouvel utilisateur</h3>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/users/validate}" th:object="${user}" method="post">

                        <div class="mb-3">
                            <label for="fullname" class="form-label font-weight-bold">Nom Complet</label>
                            <input type="text" th:field="*{fullname}" id="fullname" class="form-control" placeholder="Prénom Nom" required>
                            <p class="text-danger" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label font-weight-bold">Identifiant (Username)</label>
                            <input type="text" th:field="*{username}" id="username" class="form-control" placeholder="Nom d'utilisateur" required>
                            <p class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label font-weight-bold">Mot de passe</label>
                            <input type="password" th:field="*{password}" id="password" class="form-control" placeholder="********" required>
                            <p class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                        </div>

                        <div class="mb-4">
                            <label class="form-label font-weight-bold">Rôle de l'utilisateur</label><br/>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{role}" th:value="ADMIN" id="roleAdmin">
                                <label class="form-check-label" for="roleAdmin">Administrateur</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{role}" th:value="USER" id="roleUser">
                                <label class="form-check-label" for="roleUser">Utilisateur standard</label>
                            </div>
                            <p class="text-danger" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Créer le compte</button>
                            <a th:href="@{/users/list}" class="btn btn-outline-secondary">Annuler</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
