<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<head>
    <title>Poseidon - Règles</title>
</head>
<body>

<div layout:fragment="content">
    <div th:if="${errorMsg}" class="alert alert-danger shadow-sm mt-3" role="alert">
        <i class="fas fa-tools"></i> <span th:text="${errorMsg}">Message d'erreur</span>
    </div>


    <div class="row mt-4 mb-3">
        <div class="col-6">
            <h2>Liste des Règles (RuleName)</h2>
        </div>
        <div class="col-6 text-right">
            <a th:href="@{/ruleName/add}" class="btn btn-primary btn-sm">Ajouter une règle</a>
        </div>
    </div>

    <table class="table table-bordered table-striped shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Nom</th>
            <th>Description</th>
            <th>Json</th>
            <th>Template</th>
            <th>Sql</th>
            <th>Sql Part</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <!-- On utilise 'ruleNames' (pluriel) comme défini dans ton RuleNameUiController -->
        <tr th:each="rule : ${ruleNames}">
            <td th:text="${rule.id}"></td>
            <td th:text="${rule.name}"></td>
            <td th:text="${rule.description}"></td>
            <td th:text="${rule.json}"></td>
            <td th:text="${rule.template}"></td>
            <td th:text="${rule.sqlStr}"></td>
            <td th:text="${rule.sqlPart}"></td>
            <td class="text-center">
                <a th:href="@{/ruleName/update/{id}(id=${rule.id})}" class="btn btn-info btn-sm">Modifier</a>
                <a th:href="@{/ruleName/delete/{id}(id=${rule.id})}" class="btn btn-danger btn-sm">Supprimer</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
