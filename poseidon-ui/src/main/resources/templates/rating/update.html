<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Poseidon - Modifier la notation</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row mt-5 justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-info">
                <div class="card-header bg-info text-white">
                    <h3 class="mb-0">Modifier la notation n° <span th:text="${rating.id}"></span></h3>
                </div>
                <div class="card-body p-4">
                    <!-- On ajoute novalidate pour tester la validation Java -->
                    <form th:action="@{/rating/update/{id}(id=${rating.id})}" th:object="${rating}" method="post" novalidate>

                        <!-- CHAMP CACHÉ POUR L'ID (Indispensable) -->
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="moodysRating" class="form-label font-weight-bold">Moody's Rating</label>
                            <input type="text" th:field="*{moodysRating}" class="form-control" id="moodysRating" />
                            <!-- AFFICHAGE ERREUR -->
                            <p class="text-danger" th:if="${#fields.hasErrors('moodysRating')}" th:errors="*{moodysRating}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="sandPRating" class="form-label font-weight-bold">S&P Rating</label>
                            <input type="text" th:field="*{sandPRating}" class="form-control" id="sandPRating" />
                            <!-- AFFICHAGE ERREUR -->
                            <p class="text-danger" th:if="${#fields.hasErrors('sandPRating')}" th:errors="*{sandPRating}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="fitchRating" class="form-label font-weight-bold">Fitch Rating</label>
                            <input type="text" th:field="*{fitchRating}" class="form-control" id="fitchRating" />
                            <!-- AFFICHAGE ERREUR -->
                            <p class="text-danger" th:if="${#fields.hasErrors('fitchRating')}" th:errors="*{fitchRating}"></p>
                        </div>

                        <div class="mb-4">
                            <label for="orderNumber" class="form-label font-weight-bold">Numéro d'ordre</label>
                            <input type="number" th:field="*{orderNumber}" class="form-control" id="orderNumber" />
                            <!-- AFFICHAGE ERREUR -->
                            <p class="text-danger" th:if="${#fields.hasErrors('orderNumber')}" th:errors="*{orderNumber}"></p>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Valider les modifications</button>
                            <a th:href="@{/rating/list}" class="btn btn-outline-danger">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
