<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Poseidon - Accès Refusé</title>
</head>
<body>

<div layout:fragment="content" class="text-center mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-danger shadow-lg">
                <div class="card-body p-5">
                    <i class="fas fa-user-shield text-danger mb-4" style="font-size: 5rem;"></i>
                    <h1 class="display-4 text-danger">ERREUR 403</h1>
                    <h2 class="mb-4">Accès Interdit</h2>
                    <p class="lead">Désolé, votre badge ne vous donne pas accès à cette zone sécurisée de Poseidon.</p>
                    <hr class="my-4">
                    <p>Si vous pensez qu'il s'agit d'une erreur, contactez l'administrateur système.</p>
                    <a th:href="@{/}" class="btn btn-primary mt-3">
                        <i class="fas fa-home"></i> Retour à l'accueil
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
