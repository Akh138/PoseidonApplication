<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Poseidon - Inscription</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        .register-container { max-width: 400px; margin-top: 50px; }
    </style>
</head>
<body>

<div class="container register-container">
    <div class="card">
        <div class="card-header bg-primary text-white text-center">
            <h3>Créer un compte</h3>
        </div>
        <div class="card-body">
            <!-- Le formulaire renvoie vers la méthode POST de ton Controller UI -->
            <form th:action="@{/register/validate}" th:object="${user}" method="post">

                <div class="mb-3">
                    <label class="form-label">Nom Complet</label>
                    <input type="text" th:field="*{fullname}" class="form-control" placeholder="Ex: Jean Dupont" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nom d'utilisateur</label>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="Identifiant" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="********" required>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success">S'inscrire</button>
                    <a th:href="@{/}" class="btn btn-outline-secondary">Retour à l'accueil</a>
                </div>

            </form>
        </div>
        <div class="card-footer text-center">
            <small>Déjà un compte ? <a th:href="@{/login}">Se connecter</a></small>
        </div>
    </div>
</div>

</body>
</html>
