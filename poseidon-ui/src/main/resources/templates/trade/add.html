<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Poseidon - Nouveau Trade</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row mt-5 justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Enregistrer une transaction</h3>
                </div>
                <div class="card-body p-4">
                    <!-- On garde novalidate pour voir tes messages rouges Java -->
                    <form th:action="@{/trade/validate}" th:object="${trade}" method="post">

                        <!-- CHAMP : ACCOUNT -->
                        <div class="mb-3">
                            <label for="account" class="form-label font-weight-bold">Compte (Account)</label>
                            <input type="text" th:field="*{account}" id="account" class="form-control" placeholder="Nom du compte">
                            <!-- AJOUT : Affichage de l'erreur en rouge -->
                            <p class="text-danger" th:if="${#fields.hasErrors('account')}" th:errors="*{account}"></p>
                        </div>

                        <!-- CHAMP : TYPE -->
                        <div class="mb-3">
                            <label for="type" class="form-label font-weight-bold">Type</label>
                            <input type="text" th:field="*{type}" id="type" class="form-control" placeholder="Ex: Cash">
                            <!-- AJOUT : Affichage de l'erreur en rouge -->
                            <p class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
                        </div>

                        <!-- CHAMP : QUANTITY -->
                        <div class="mb-4">
                            <label for="buyQuantity" class="form-label font-weight-bold">Quantité d'achat</label>
                            <input type="number" step="0.01" th:field="*{buyQuantity}" id="buyQuantity" class="form-control" placeholder="0.00">
                            <!-- AJOUT : Affichage de l'erreur en rouge -->
                            <p class="text-danger" th:if="${#fields.hasErrors('buyQuantity')}" th:errors="*{buyQuantity}"></p>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Valider le Trade</button>
                            <a th:href="@{/trade/list}" class="btn btn-outline-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
