<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Poseidon - Modifier Trade</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row mt-5 justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-info">
                <div class="card-header bg-info text-white">
                    <h3 class="mb-0">Modifier le Trade n° <span th:text="${trade.tradeId}"></span></h3>
                </div>
                <div class="card-body p-4">
                    <!-- On ajoute novalidate pour laisser Java gérer les erreurs -->
                    <form th:action="@{/trade/update/{id}(id=${trade.tradeId})}" th:object="${trade}" method="post" novalidate>

                        <!-- CHAMP CACHÉ POUR L'ID -->
                        <input type="hidden" th:field="*{tradeId}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="account" class="form-label font-weight-bold">Compte</label>
                                <input type="text" th:field="*{account}" id="account" class="form-control" />
                                <!-- ERREUR COMPTE -->
                                <p class="text-danger" th:if="${#fields.hasErrors('account')}" th:errors="*{account}"></p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="type" class="form-label font-weight-bold">Type</label>
                                <input type="text" th:field="*{type}" id="type" class="form-control" />
                                <!-- ERREUR TYPE -->
                                <p class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="buyQuantity" class="form-label font-weight-bold">Quantité Achat</label>
                                <input type="number" step="0.01" th:field="*{buyQuantity}" id="buyQuantity" class="form-control"/>
                                <!-- ERREUR QUANTITÉ -->
                                <p class="text-danger" th:if="${#fields.hasErrors('buyQuantity')}" th:errors="*{buyQuantity}"></p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="sellQuantity" class="form-label font-weight-bold">Quantité Vente</label>
                                <input type="number" step="0.01" th:field="*{sellQuantity}" id="sellQuantity" class="form-control"/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="buyPrice" class="form-label font-weight-bold">Prix Achat</label>
                                <input type="number" step="0.01" th:field="*{buyPrice}" id="buyPrice" class="form-control"/>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="sellPrice" class="form-label font-weight-bold">Prix Vente</label>
                                <input type="number" step="0.01" th:field="*{sellPrice}" id="sellPrice" class="form-control"/>
                            </div>
                        </div>

                        <div class="d-grid gap-2 border-top pt-3">
                            <button type="submit" class="btn btn-primary">Enregistrer les changements</button>
                            <a th:href="@{/trade/list}" class="btn btn-outline-danger">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
