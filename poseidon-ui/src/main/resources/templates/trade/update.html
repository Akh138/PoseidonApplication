<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Poseidon - Modifier la Transaction</title>
    <style>
        .form-container {
            margin-top: 35px;
            padding-bottom: 50px;
        }
        .form-card {
            background-color: #1c2541 !important;
            border: 1px solid #334155 !important;
            border-radius: 12px;
            overflow: hidden;
        }
        .form-control-dark {
            background-color: #0b132b !important;
            border: 1px solid #334155 !important;
            color: #ffffff !important;
            border-radius: 8px;
            padding: 10px 14px;
        }
        .form-control-dark:focus {
            border-color: #4ade80 !important;
            box-shadow: 0 0 0 0.25rem rgba(74, 222, 128, 0.25) !important;
        }
    </style>
</head>
<body>

<div layout:fragment="content">
    <div class="form-container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <div class="card form-card shadow-lg">
                    <!-- En-tête -->
                    <div class="card-header py-3 px-4 border-bottom border-secondary" style="background-color: #131b2e;">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                <i class="fa-solid fa-pen-to-square text-success fs-4 me-2"></i>
                                <h4 class="mb-0 text-white fw-bold">
                                    Ajustement du Contrat <span class="badge bg-secondary font-monospace ms-1" th:text="'#' + ${trade.tradeId}">#1</span>
                                </h4>
                            </div>
                            <span class="badge rounded-pill px-3 py-1" style="background-color: rgba(74, 222, 128, 0.2); color: #4ade80; border: 1px solid #4ade80;">
                            Middle-Office
                        </span>
                        </div>
                    </div>

                    <div class="card-body p-4">
                        <p class="text-light text-opacity-75 small mb-4">
                            Mise à jour des paramètres contractuels : prix d'exécution, volumes d'achat et de vente associés au contrat.
                        </p>

                        <form th:action="@{/trade/update/{id}(id=${trade.tradeId})}" th:object="${trade}" method="post" novalidate>

                            <!-- ID Caché indispensable -->
                            <input type="hidden" th:field="*{tradeId}">

                            <!-- LIGNE 1 : COMPTE & TYPE -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="account" class="form-label text-light fw-semibold small">
                                        <i class="fa-solid fa-building-columns text-success me-1"></i> Compte Contrepartie
                                    </label>
                                    <input type="text" th:field="*{account}" id="account" class="form-control form-control-dark" />
                                    <p class="text-danger small mt-1" th:if="${#fields.hasErrors('account')}" th:errors="*{account}"></p>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="type" class="form-label text-light fw-semibold small">
                                        <i class="fa-solid fa-tag text-info me-1"></i> Type de Contrat
                                    </label>
                                    <input type="text" th:field="*{type}" id="type" class="form-control form-control-dark" />
                                    <p class="text-danger small mt-1" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
                                </div>
                            </div>

                            <!-- LIGNE 2 : VOLUMES ACHAT / VENTE -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="buyQuantity" class="form-label text-light fw-semibold small">
                                        <i class="fa-solid fa-cart-shopping text-warning me-1"></i> Quantité Achetée
                                    </label>
                                    <input type="number" step="0.01" th:field="*{buyQuantity}" id="buyQuantity" class="form-control form-control-dark" />
                                    <p class="text-danger small mt-1" th:if="${#fields.hasErrors('buyQuantity')}" th:errors="*{buyQuantity}"></p>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="sellQuantity" class="form-label text-light fw-semibold small">
                                        <i class="fa-solid fa-sack-dollar text-light me-1"></i> Quantité Vendue
                                    </label>
                                    <input type="number" step="0.01" th:field="*{sellQuantity}" id="sellQuantity" class="form-control form-control-dark" />
                                </div>
                            </div>

                            <!-- LIGNE 3 : PRIX ACHAT / PRIX VENTE -->
                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <label for="buyPrice" class="form-label text-light fw-semibold small">
                                        <i class="fa-solid fa-arrow-trend-up text-success me-1"></i> Prix d'Exécution Achat (€/$)
                                    </label>
                                    <input type="number" step="0.01" th:field="*{buyPrice}" id="buyPrice" class="form-control form-control-dark" />
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label for="sellPrice" class="form-label text-light fw-semibold small">
                                        <i class="fa-solid fa-arrow-trend-down text-danger me-1"></i> Prix d'Exécution Vente (€/$)
                                    </label>
                                    <input type="number" step="0.01" th:field="*{sellPrice}" id="sellPrice" class="form-control form-control-dark" />
                                </div>
                            </div>

                            <!-- BOUTONS D'ACTION -->
                            <div class="d-grid gap-2 border-top border-secondary pt-3">
                                <button type="submit" class="btn py-2 fw-semibold text-dark shadow-sm" style="background-color: #4ade80; border-color: #4ade80;">
                                    <i class="fa-solid fa-floppy-disk me-1"></i> Enregistrer les Modifications Contractuelles
                                </button>
                                <a th:href="@{/trade/list}" class="btn btn-outline-secondary py-2 text-light">
                                    <i class="fa-solid fa-xmark me-1"></i> Annuler
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
