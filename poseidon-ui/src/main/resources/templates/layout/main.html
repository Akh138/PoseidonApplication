<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Poseidon Trading Desk</title>
    <!-- CSS Bootstrap 5 & FontAwesome -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* FOND SOMBRE DE SALLE DES MARCHÉS POUR TOUT LE SITE */
        body {
            padding-top: 75px;
            background-color: #0b132b;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Conteneur principal */
        main {
            flex: 1 0 auto;
        }

        /* PIED DE PAGE DISCRET ET FINANCIER */
        footer {
            background-color: #070d1e;
            color: #64748b;
            border-top: 1px solid #1e293b;
            padding: 18px 0;
            margin-top: 60px;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>

<!-- BARRE DE NAVIGATION COMMUNE (HEADER) -->
<header th:replace="~{common/header :: menu}"></header>

<!-- CONTENU INJECTÉ DYNAMIQUEMENT PAR CHAQUE PAGE -->
<main class="container">
    <div layout:fragment="content"></div>
</main>

<!-- PIED DE PAGE INSTITUTIONNEL SANS JARGON TECHNIQUE -->
<footer class="footer mt-auto py-3">
    <div class="container text-center">
        <span>© 2026 Poseidon Trading Desk • Plateforme Institutionnelle de Négociation & Analyse des Risques</span>
    </div>
</footer>

</body>
</html>
