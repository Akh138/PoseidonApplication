<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Poseidon - Ajouter une offre</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row mt-5 justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Ajouter une nouvelle offre</h3>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/bidList/validate}" th:object="${bidList}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="account" class="form-label font-weight-bold">Compte (Account)</label>
                            <input type="text" th:field="*{account}" id="account" class="form-control" placeholder="Ex: Corporate" />
                            <p class="text-danger" th:if="${#fields.hasErrors('account')}" th:errors="*{account}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="type" class="form-label font-weight-bold">Type</label>
                            <input type="text" th:field="*{type}" id="type" class="form-control" placeholder="Ex: Buy/Sell" />
                            <p class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
                        </div>

                        <div class="mb-4">
                            <label for="bidQuantity" class="form-label font-weight-bold">Quantité</label>
                            <input type="number" step="0.01" th:field="*{bidQuantity}" id="bidQuantity" class="form-control" placeholder="0.00"/>
                            <p class="text-danger" th:if="${#fields.hasErrors('bidQuantity')}" th:errors="*{bidQuantity}"></p>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Enregistrer l'offre</button>
                            <a th:href="@{/bidList/list}" class="btn btn-outline-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
