# --- CONFIGURATION G\u00C9N\u00C9RALE ---
# D\u00E9finit le nom logique du service. C'est son nom officiel dans l'annuaire Consul.
spring.application.name=user
# Port d'\u00E9coute unique pour le microservice User.
server.port=8086
# Connexion au serveur de configuration centralis\u00E9 (GitHub via port 8071).
# "optional:" permet au service de d\u00E9marrer m\u00EAme si le serveur de config met du temps \u00E0 r\u00E9pondre.
spring.config.import=optional:configserver:http://localhost:8071/

# ===================================================================
# CHOIX 1 : BASE DE DONN\u00C9ES H2 (D\u00E9sactiv\u00E9 actuellement)
# Ces lignes sont en commentaire car on utilise MySQL pour la persistance.
# ===================================================================
#spring.datasource.url=jdbc:h2:mem:userdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.h2.console.enabled=true

# ===================================================================
# CHOIX 2 : BASE DE DONN\u00C9ES MYSQL (Actif - Mode Professionnel)
# ===================================================================
# URL de connexion au conteneur MySQL. "poseidon-db" est le nom du service dans Docker Compose.
spring.datasource.url=jdbc:mysql://poseidon-db:3306/poseidon_db
# Le pilote (driver) moderne pour permettre \u00E0 Java de parler \u00E0 MySQL 8.
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# Identifiants d\u00E9finis dans ton fichier docker-compose.yml.
spring.datasource.username=root
spring.datasource.password=root
# Optimise les requ\u00EAtes SQL g\u00E9n\u00E9r\u00E9es pour le langage sp\u00E9cifique de MySQL.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- CONFIGURATION COMMUNE JPA / HIBERNATE ---
# "update" demande \u00E0 Hibernate de cr\u00E9er ou modifier les tables SQL automatiquement.
spring.jpa.hibernate.ddl-auto=update
# Affiche les requ\u00EAtes SQL dans ton terminal IntelliJ pour le d\u00E9buggage.
spring.jpa.show-sql=true
# TR\u00C8S IMPORTANT : Force Spring \u00E0 attendre que les tables soient cr\u00E9\u00E9es avant de lire data.sql.
spring.jpa.defer-datasource-initialization=true
# Dit \u00E0 Spring de toujours ex\u00E9cuter le script d'initialisation (data.sql) au d\u00E9marrage.
spring.sql.init.mode=always

# --- ENREGISTREMENT DANS CONSUL (D\u00C9COUVERTE) ---
# Adresse du service Consul dans le r\u00E9seau Docker.
spring.cloud.consul.host=consul
# Port standard de l'annuaire Consul.
spring.cloud.consul.port=8500
# Cr\u00E9e un identifiant unique (nom du service + un chiffre al\u00E9atoire) pour \u00E9viter les doublons.
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
# Le nom sous lequel le service appara\u00EEt dans l'annuaire (http://localhost:8500).
spring.cloud.consul.discovery.service-name=${spring.application.name}
# Utilise l'IP interne de Docker pour la communication entre conteneurs (plus stable).
spring.cloud.consul.discovery.prefer-ip-address=true

# --- CONFIGURATION ACTUATOR (SANT\u00C9 DU SERVICE) ---
# Expose l'adresse /actuator/health pour que Consul puisse v\u00E9rifier que le service est vivant.
management.endpoints.web.exposure.include=health
# Affiche le d\u00E9tail complet des composants (disque, DB) dans le JSON de sant\u00E9.
management.endpoint.health.show-details=always

#\u00C0 quoi sert-il ?
# C'est la Fiche de Pilotage du microservice User. C'est ici que tu as configur\u00E9 le passage du mode "Test" (H2) au mode "Production" (MySQL). Ce fichier fait le lien entre ton code Java et toute ton infrastructure Docker (Base de donn\u00E9es, Consul, Config Server).
#
#Ce qu'il faut retenir :
#
#    La Persistance (MySQL) : En activant le Choix 2, tu as rendu tes donn\u00E9es "immortelles". Tes utilisateurs ne disparaissent plus quand tu \u00E9teins ton PC.
#
#    L'Intelligence R\u00E9seau (Consul) : Les r\u00E9glages spring.cloud.consul permettent \u00E0 la Gateway de trouver ce microservice automatiquement sans que tu n'aies \u00E0 g\u00E9rer des adresses IP compliqu\u00E9es.
#
#    L'initialisation S\u00E9curis\u00E9e : Avec defer-datasource-initialization, tu garantis que ton administrateur sera toujours cr\u00E9\u00E9 proprement dans la base de donn\u00E9es au d\u00E9marrage