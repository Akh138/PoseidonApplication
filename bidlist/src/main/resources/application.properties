# --- CONNEXION AU SERVEUR DE CONFIGURATION ---
# Cette ligne est cruciale : elle dit au microservice de ne pas d\u00E9marrer tout seul,
# mais d'aller chercher ses r\u00E9glages (mots de passe, messages, etc.) sur le serveur de config (port 8071).
# "optional:" \u00E9vite que l'application ne crash si le serveur met une seconde de trop \u00E0 r\u00E9pondre.
spring.config.import=optional:configserver:http://localhost:8071/

# --- IDENTIT\u00C9 DU SERVICE ---
# Le port sur lequel ce microservice va \u00E9couter les requ\u00EAtes (diff\u00E9rent pour chaque service)
server.port=8081
# Le nom unique de l'application. C'est ce nom que Consul utilisera pour l'identifier.
spring.application.name=bidlist

# --- CONFIGURATION DE LA BASE DE DONN\u00C9ES H2 ---
# Adresse de la base de donn\u00E9es en m\u00E9moire (RAM). Elle s'appelle "bidlistdb".
spring.datasource.url=jdbc:h2:mem:bidlistdb
# Le pilote Java n\u00E9cessaire pour parler \u00E0 H2
spring.datasource.driverClassName=org.h2.Driver
# Identifiants par d\u00E9faut pour H2
spring.datasource.username=sa
spring.datasource.password=
# Active l'interface web (http://localhost:8081/h2-console) pour voir les tables
spring.h2.console.enabled=true

# --- CONFIGURATION JPA / HIBERNATE ---
# Optimise les requ\u00EAtes SQL sp\u00E9cifiquement pour le langage de H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# "update" dit \u00E0 Hibernate de cr\u00E9er les tables automatiquement si elles n'existent pas
spring.jpa.hibernate.ddl-auto=update
# Affiche toutes les requ\u00EAtes SQL dans le terminal (tr\u00E8s utile pour d\u00E9buguer)
spring.jpa.show-sql=true

# --- INITIALISATION DES DONN\u00C9ES (data.sql) ---
# TR\u00C8S IMPORTANT : Dit \u00E0 Spring d'attendre que les tables soient cr\u00E9\u00E9es par Hibernate
# avant de tenter d'ins\u00E9rer les donn\u00E9es du fichier data.sql
spring.jpa.defer-datasource-initialization=true
# Force l'ex\u00E9cution du fichier data.sql \u00E0 chaque d\u00E9marrage
spring.sql.init.mode=always

# --- ENREGISTREMENT DANS CONSUL (SERVICE DISCOVERY) ---
# Adresse de la machine Consul (dans le r\u00E9seau Docker, elle s'appelle "consul")
spring.cloud.consul.host=consul
# Port par d\u00E9faut de l'annuaire Consul
spring.cloud.consul.port=8500
# G\u00E9n\u00E8re un ID unique pour cette instance (nom du service + un chiffre al\u00E9atoire)
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
# Le nom sous lequel le service sera affich\u00E9 dans l'interface de Consul (http://localhost:8500)
spring.cloud.consul.discovery.service-name=${spring.application.name}
# Utilise l'adresse IP interne de Docker pour que les autres services trouvent ce service plus vite
spring.cloud.consul.discovery.prefer-ip-address=true

# --- SURVEILLANCE ET SANT\u00C9 (ACTUATOR) ---
# Expose l'adresse /actuator/health pour que Consul puisse v\u00E9rifier si le service est vivant (voyant vert)
management.endpoints.web.exposure.include=health
# Affiche tous les d\u00E9tails de sant\u00E9 (disque, base de donn\u00E9es, etc.) dans le JSON de sant\u00E9
management.endpoint.health.show-details=always

#\u00C0 quoi sert-il ?
# C'est le Manuel d'instructions du microservice. Sans lui, Spring Boot ne saurait pas sur quel port d\u00E9marrer, quelle base de donn\u00E9es utiliser, ni comment s'inscrire dans l'annuaire Consul.
#
#Ce qu'il faut retenir :
#
#    L'import de config : C'est le lien avec ton GitHub. Cela permet de centraliser tes r\u00E9glages.
#
#    La Discovery (Consul) : C'est la "carte d'identit\u00E9" du service. Gr\u00E2ce \u00E0 ces lignes, le service devient visible par la Gateway et le Portail UI.
#
#    L'Actuator : C'est le "docteur" interne. Il permet \u00E0 Consul de mettre le voyant au VERT si tout va bien.
#
#    H2 vs MySQL : Ici, on est en mode "d\u00E9veloppement" (H2). Pour passer en mode "pro" (MySQL), c'est ici qu'on changerait les lignes de datasource.