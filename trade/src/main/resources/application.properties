# --- CONNEXION AU SERVEUR DE CONFIGURATION ---
# Dit au microservice d'appeler le Config Server (port 8071) pour charger ses r\u00E9glages GitHub.
# "optional:" \u00E9vite que le service ne plante s'il d\u00E9marre avant que le serveur de config ne soit pr\u00EAt.
spring.config.import=optional:configserver:http://localhost:8071/

# --- IDENTIT\u00C9 ET R\u00C9SEAU ---
# Port sp\u00E9cifique pour ce service. Le port 8085 est la porte d'entr\u00E9e pour les transactions (Trades).
server.port=8085
# Nom de l'application utilis\u00E9 comme identifiant par le Config Server et par Consul.
spring.application.name=trade

# --- CONFIGURATION DE LA BASE DE DONN\u00C9ES H2 ---
# Adresse de la base de donn\u00E9es stock\u00E9e en m\u00E9moire vive (RAM). Elle s'appelle "tradedb".
spring.datasource.url=jdbc:h2:mem:tradedb
# Le pilote Java permettant de discuter avec le moteur de base de donn\u00E9es H2.
spring.datasource.driverClassName=org.h2.Driver
# Identifiant de l'administrateur syst\u00E8me de la base de donn\u00E9es.
spring.datasource.username=sa
# Pas de mot de passe par d\u00E9faut pour H2 en mode d\u00E9veloppement.
spring.datasource.password=
# Active la console web (http://localhost:8085/h2-console) pour voir tes tables SQL.
spring.h2.console.enabled=true

# --- INITIALISATION ET JPA ---
# TR\u00C8S IMPORTANT : Force Spring \u00E0 attendre la cr\u00E9ation des tables par Hibernate
# avant de lancer le fichier data.sql. Sans cela, l'insertion des donn\u00E9es \u00E9choue au d\u00E9marrage.
spring.jpa.defer-datasource-initialization=true
# Dit \u00E0 Spring de toujours ex\u00E9cuter le script SQL de test au d\u00E9marrage.
spring.sql.init.mode=always

# --- ENREGISTREMENT DANS CONSUL (SERVICE DISCOVERY) ---
# Adresse du conteneur Consul dans ton r\u00E9seau Docker.
spring.cloud.consul.host=consul
# Port standard de l'annuaire Consul (8500).
spring.cloud.consul.port=8500
# G\u00E9n\u00E8re un identifiant unique pour cette instance (nom du service + un chiffre al\u00E9atoire).
# Cela permet d'avoir plusieurs services Trade sans qu'ils ne se confondent dans l'annuaire.
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
# Le nom sous lequel le service sera list\u00E9 dans le r\u00E9pertoire (ex: pour la Gateway).
spring.cloud.consul.discovery.service-name=${spring.application.name}
# Utilise l'adresse IP interne de Docker au lieu du nom d'h\u00F4te pour une meilleure stabilit\u00E9.
spring.cloud.consul.discovery.prefer-ip-address=true

# --- SURVEILLANCE ET SANT\u00C9 (ACTUATOR) ---
# Ouvre l'adresse /actuator/health pour que Consul puisse v\u00E9rifier que le service n'est pas mort.
# C'est ce qui fait passer ton voyant au VERT dans Consul.
management.endpoints.web.exposure.include=health
# Affiche le d\u00E9tail complet de l'\u00E9tat de sant\u00E9 (Base de donn\u00E9es, disque, etc.) dans le JSON.
management.endpoint.health.show-details=always

#\u00C0 quoi sert-il ?
#C'est la Fiche d'identit\u00E9 technique du microservice Trade. C'est l'endroit o\u00F9 tu configures tout l'aspect "Cloud" (Config Server, Consul) et l'aspect "Donn\u00E9es" (H2, JPA).
#
#Ce qu'il faut retenir :
#
#    Centralisation : La premi\u00E8re ligne montre que le service est d\u00E9pendant du Config Server pour ses r\u00E9glages avanc\u00E9s.
#
#    Visibilit\u00E9 (Discovery) : Les lignes spring.cloud.consul sont essentielles. C'est gr\u00E2ce \u00E0 elles que l'interface UI peut appeler http://trade/ au lieu de chercher une adresse IP compliqu\u00E9e.
#
#    Sant\u00E9 (Actuator) : C'est le "check-up" m\u00E9dical du service. Sans ces lignes, ton architecture ne pourrait pas s'auto-surveiller.
#
#    H2 (In-memory) : Actuellement, le service travaille en m\u00E9moire. Pour passer sur ton nouveau conteneur MySQL, c'est ici qu'on changerait la ligne spring.datasource.url