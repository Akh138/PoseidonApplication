# --- CONNEXION AU SERVEUR DE CONFIGURATION ---
# Dit au service d'aller chercher ses r\u00E9glages sur le Config Server (port 8071).
# C'est la "t\u00E9l\u00E9commande" qui permet de configurer le service \u00E0 distance via GitHub.
spring.config.import=optional:configserver:http://localhost:8071/

# --- IDENTIT\u00C9 ET R\u00C9SEAU ---
# Le port sp\u00E9cifique \u00E0 ce microservice. On utilise le 8082 pour \u00E9viter les conflits.
server.port=8082
# Le nom qui sert d'identifiant unique pour ce service dans tout l'\u00E9cosyst\u00E8me Poseidon.
spring.application.name=curvepoint

# --- CONFIGURATION DE LA BASE DE DONN\u00C9ES H2 ---
# Connexion \u00E0 la base de donn\u00E9es en m\u00E9moire vive (RAM). Elle s'appelle "curvepointdb".
spring.datasource.url=jdbc:h2:mem:curvepointdb
# Le pilote n\u00E9cessaire pour que Java comprenne le langage de la base H2.
spring.datasource.driverClassName=org.h2.Driver
# Identifiants de s\u00E9curit\u00E9 par d\u00E9faut (sa = System Administrator).
spring.datasource.username=sa
spring.datasource.password=
# Permet d'acc\u00E9der \u00E0 l'interface visuelle de la base via : http://localhost:8082/h2-console
spring.h2.console.enabled=true

# --- CONFIGURATION JPA / HIBERNATE ---
# "update" demande \u00E0 Hibernate de cr\u00E9er les tables SQL automatiquement en lisant tes classes @Entity.
spring.jpa.hibernate.ddl-auto=update
# Affiche toutes les commandes SQL g\u00E9n\u00E9r\u00E9es par Java dans ton terminal IntelliJ.
spring.jpa.show-sql=true
# Rend le code SQL affich\u00E9 dans la console plus lisible (sauts de ligne, indentation).
spring.jpa.properties.hibernate.format_sql=true

# --- INITIALISATION DES DONN\u00C9ES (data.sql) ---
# TR\u00C8S IMPORTANT : Force Spring \u00E0 attendre que les tables soient pr\u00EAtes avant de lire le fichier data.sql.
# Sans cette ligne, le microservice essaie d'ins\u00E9rer des donn\u00E9es dans une table qui n'existe pas encore.
spring.jpa.defer-datasource-initialization=true
# Dit \u00E0 Spring de toujours ex\u00E9cuter le script d'initialisation au d\u00E9marrage.
spring.sql.init.mode=always

# --- ENREGISTREMENT DANS CONSUL (ANNUAIRE) ---
# Adresse du conteneur Consul dans le r\u00E9seau Docker.
spring.cloud.consul.host=consul
# Port de communication avec Consul.
spring.cloud.consul.port=8500
# Cr\u00E9e une "immatriculation" unique pour ce service dans l'annuaire.
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
# Le nom sous lequel les autres services (comme l'UI) vont te chercher.
spring.cloud.consul.discovery.service-name=${spring.application.name}
# Utilise l'adresse IP interne de Docker, indispensable pour que les conteneurs se voient entre eux.
spring.cloud.consul.discovery.prefer-ip-address=true

# --- SURVEILLANCE ET SANT\u00C9 (ACTUATOR) ---
# Ouvre la porte "/actuator/health" pour que Consul puisse v\u00E9rifier que le service n'est pas plant\u00E9.
management.endpoints.web.exposure.include=health
# Donne le d\u00E9tail complet de l'\u00E9tat de sant\u00E9 (Base de donn\u00E9es, disque, etc.) dans le JSON.
management.endpoint.health.show-details=always

#\u00C0 quoi sert-il ?
# C'est la Fiche de Mission du microservice. Ce fichier est le seul endroit o\u00F9 l'on d\u00E9finit comment le microservice doit se comporter dans son environnement (Docker, Consul, Base de donn\u00E9es).
#
#Ce qu'il faut retenir :
#
#    Isolation des donn\u00E9es : Remarque que le nom de la base (curvepointdb) est diff\u00E9rent de celui de BidList. Chaque microservice a son propre jardin secret.
#
#    Aiguillage (Consul) : Les lignes spring.cloud.consul sont les plus importantes pour la "D\u00E9couverte". C'est gr\u00E2ce \u00E0 elles que tu as pu supprimer les num\u00E9ros de ports dans tes URLs du Portail UI.
#
#    Check-up (Actuator) : C'est le carnet de sant\u00E9. Sans les deux derni\u00E8res lignes, Consul afficherait une croix rouge m\u00EAme si ton service fonctionne.