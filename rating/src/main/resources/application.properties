# --- CONNEXION AU SERVEUR DE CONFIGURATION ---
# Cette ligne ordonne au microservice de se connecter au Config Server (port 8071).
# Il va y chercher ses r\u00E9glages personnalis\u00E9s (mots de passe, messages) stock\u00E9s sur GitHub.
# "optional:" permet \u00E0 l'application de ne pas crasher si le serveur met du temps \u00E0 r\u00E9pondre.
spring.config.import=optional:configserver:http://localhost:8071/

# --- R\u00C9GLAGES R\u00C9SEAU ET IDENTIT\u00C9 ---
# Port d'\u00E9coute sp\u00E9cifique pour le service Rating (8083).
server.port=8083
# Le nom du service. C'est son nom officiel pour le Config Server et pour l'annuaire Consul.
spring.application.name=rating

# --- CONFIGURATION DE LA BASE DE DONN\u00C9ES H2 ---
# URL de la base de donn\u00E9es en m\u00E9moire vive (RAM). Elle s'appelle "ratingdb".
spring.datasource.url=jdbc:h2:mem:ratingdb
# Le pilote Java permettant de traduire les ordres du code vers le langage de H2.
spring.datasource.driverClassName=org.h2.Driver
# Identifiants de connexion par d\u00E9faut (sa = administrateur syst\u00E8me).
spring.datasource.username=sa
spring.datasource.password=
# Active l'interface web pour voir les tables : http://localhost:8083/h2-console
spring.h2.console.enabled=true

# --- INITIALISATION ET JPA ---
# TR\u00C8S IMPORTANT : Dit \u00E0 Spring d'attendre que Hibernate ait fini de cr\u00E9er les tables
# avant de lancer le fichier data.sql. Sans \u00E7a, l'insertion \u00E9choue.
spring.jpa.defer-datasource-initialization=true
# Ordonne \u00E0 Spring de toujours ex\u00E9cuter le script SQL de test au d\u00E9marrage.
spring.sql.init.mode=always

# --- ENREGISTREMENT DANS CONSUL (SERVICE DISCOVERY) ---
# Adresse du serveur Consul (dans Docker, le nom du service "consul" suffit).
spring.cloud.consul.host=consul
# Port standard de l'annuaire Consul.
spring.cloud.consul.port=8500
# G\u00E9n\u00E8re un identifiant unique pour cette instance (nom du service + un chiffre au hasard).
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
# Le nom que Consul affichera dans son r\u00E9pertoire (http://localhost:8500).
spring.cloud.consul.discovery.service-name=${spring.application.name}
# Force l'utilisation de l'IP interne de Docker pour que les conteneurs se voient entre eux.
spring.cloud.consul.discovery.prefer-ip-address=true

# --- SURVEILLANCE ET SANT\u00C9 (ACTUATOR) ---
# Ouvre l'adresse /actuator/health pour que Consul puisse v\u00E9rifier le voyant vert/rouge.
management.endpoints.web.exposure.include=health
# Affiche les d\u00E9tails techniques du test de sant\u00E9 dans le JSON de r\u00E9ponse.
management.endpoint.health.show-details=always

#\u00C0 quoi sert-il ?
#C'est le Cerveau de Configuration du microservice. Sans ce fichier, Spring Boot ne saurait pas comment sortir de son propre code pour rejoindre l'annuaire Consul, ni comment parler \u00E0 sa base de donn\u00E9es.
#
#Ce qu'il faut retenir :
#
#    Ind\u00E9pendance : Remarque que le port (8083) et le nom de la base (ratingdb) sont uniques. Cela \u00E9vite que les microservices ne se m\u00E9langent les pinceaux.
#
#    Visibilit\u00E9 (Consul) : Les lignes spring.cloud.consul sont les plus "pro". Elles permettent \u00E0 la Gateway et au Portail UI de trouver le service Rating sans conna\u00EEtre son adresse IP.
#
#    Survie (Actuator) : C'est gr\u00E2ce aux deux derni\u00E8res lignes que tu as un voyant VERT sur Consul. Elles permettent au syst\u00E8me de s'auto-surveiller.